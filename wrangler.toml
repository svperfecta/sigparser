name = "sigparser"
main = "src/index.ts"
# Brian's Cloudflare account that owns sigparser (workers.dev subdomain: rocketsciencegg).
# Pinned so wrangler never prompts or picks another logged-in account.
account_id = "89a1b9fbcf7d0971fcfa1404054964a3"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
PUBLIC_URL = "https://sigparser.rocketsciencegg.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "sigparser-db"
database_id = "983a84bf-3a80-47d6-badc-e2ecbcf8d57f"
migrations_dir = "src/db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "9ee38f66272841f684bf6973f2680bd3"

# OAuth grants/tokens for the MCP surface. Shares the KV namespace; keys are prefixed
# (oauth-state:, oauth-consent:, and workers-oauth-provider's own grant:/token:/client:).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "9ee38f66272841f684bf6973f2680bd3"

[triggers]
# Every minute while the Feb-Oct 2026 backfill runs; set back to "*/15 * * * *" once both
# accounts in sync_state have batch_current_date past today.
crons = ["* * * * *"]

[site]
bucket = "./static"
